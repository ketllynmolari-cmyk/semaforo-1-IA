<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Semáforo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Semáforo Interativo</h1>
  <p>Clique para mudar a luz!</p>

  <div class="semaforo">
    <div id="vermelho" class="luz"></div>
    <div id="amarelo" class="luz"></div>
    <div id="verde" class="luz"></div>
  </div>

  <button onclick="mudarLuz('vermelho')">Vermelho</button>
  <button onclick="mudarLuz('amarelo')">Amarelo</button>
  <button onclick="mudarLuz('verde')">Verde</button>

  <script src="script.js"></script>
</body>
</html>
